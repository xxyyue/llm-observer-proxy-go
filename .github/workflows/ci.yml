name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Check module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          ATIF_FIXTURE_DIR: ${{ runner.temp }}/atif-fixtures
        run: go test -race ./...
      - name: Validate ATIF with pinned Harbor models
        run: |
          python3 -m venv "$RUNNER_TEMP/atif-venv"
          "$RUNNER_TEMP/atif-venv/bin/pip" install pydantic==2.12.3
          "$RUNNER_TEMP/atif-venv/bin/python" scripts/validate_atif.py "$RUNNER_TEMP/atif-fixtures"
      - name: Build
        run: go build -trimpath ./cmd/llm-observer-proxy
